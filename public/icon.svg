<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Washing Machine Body -->
  <rect x="96" y="80" width="320" height="352" rx="36" fill="#f8fafc" stroke="#10b981" stroke-width="8"/>
  <!-- Top Panel -->
  <rect x="96" y="80" width="320" height="84" rx="36" fill="#e2e8f0"/>
  <rect x="96" y="128" width="320" height="36" fill="#e2e8f0"/>
  <!-- Knobs & Display -->
  <circle cx="152" cy="122" r="16" fill="#064e3b"/>
  <circle cx="196" cy="122" r="12" fill="#047857"/>
  <rect x="250" y="108" width="130" height="28" rx="6" fill="#0f172a"/>
  <text x="315" y="128" font-family="monospace" font-size="16" font-weight="bold" fill="#34d399" text-anchor="middle">OFFLINE</text>
  <!-- Drum Outer -->
  <circle cx="256" cy="272" r="106" fill="#cbd5e1" stroke="#94a3b8" stroke-width="4"/>
  <!-- Drum Glass Door -->
  <circle cx="256" cy="272" r="88" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="6"/>
  <!-- Water & Wave -->
  <path d="M180,290 Q220,270 256,290 T332,290 L332,340 Q256,365 180,340 Z" fill="#0ea5e9" fill-opacity="0.8"/>
  <!-- Washing Bubble Accent -->
  <circle cx="390" cy="110" r="30" fill="url(#bubbleGrad)" stroke="#ffffff" stroke-width="4"/>
  <path d="M375,110 L385,120 L405,100" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
